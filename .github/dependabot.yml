# Dependabot version updates.
# Docs: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# The only package manifest is package.json, which holds dev tooling (eslint).
# The extension itself ships no npm dependencies, so these PRs never change
# what users install. The github-actions entry keeps the release workflow current.

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    # Dev-only tooling: one grouped PR per week instead of one per package.
    groups:
      dev-tooling:
        patterns:
          - "*"
    ignore:
      # Pinned to a GitLab commit on purpose; Dependabot cannot track it.
      - dependency-name: "eslint-config-gnome"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
